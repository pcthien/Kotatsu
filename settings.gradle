pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

// Local composite build of kotatsu-parsers for source maintenance.
// Active when ../kotatsu-parsers exists. Set env KOTATSU_JITPACK_PARSERS=1 to force the JitPack dependency instead.
def localParsers = file('../kotatsu-parsers')
if (localParsers.exists() && System.getenv('KOTATSU_JITPACK_PARSERS') == null) {
	includeBuild(localParsers) {
		dependencySubstitution {
			substitute(module('com.github.KotatsuApp:kotatsu-parsers')).using(project(':'))
		}
	}
}

include ':app'
rootProject.name = "Kotatsu"
